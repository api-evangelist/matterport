aid: matterport
name: MatterPort
description: >-
  Matterport is a spatial data company (now a CoStar Group company) whose platform
  captures physical spaces and turns them into immersive, dimensionally-accurate 3D
  models known as digital twins. Used across residential and commercial real estate,
  architecture/engineering/construction, facilities management, insurance, retail and
  travel, the platform pairs a capture pipeline (Pro cameras, 360 cameras, LiDAR and
  smartphone apps) with a hosted Showcase 3D player and a developer surface. Developers
  build on Matterport through a GraphQL API family (Model API, Account API, Import API),
  the Property Intelligence API, the Custom Roles API, and a family of JavaScript SDKs
  (SDK for Embeds, SDK Bundle, and a WebComponent) that let applications embed and
  script the 3D Showcase player, read space geometry and metadata, and manage models.
