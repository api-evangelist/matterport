    Matterport's public GraphQL API family. The Model API reads and manages 3D models
    (spaces, meshes, assets, labels/tags, sweeps); the Account API manages account,
    folders and users; the Import API ingests externally-captured data. Authenticated
    with an API Token (Token ID + Token Secret) over HTTP Basic auth.
